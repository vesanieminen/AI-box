{
  "network": {
    "host": "127.0.0.1",
    "port": 5810,
    "disable_auth": true,
    "disable_fetch_requests": true,
    "send_tracebacks": false,
    "api_servers": [
      "OAI"
    ],
    "sse_ping_interval": 15
  },
  "logging": {
    "log_prompt": false,
    "log_generation_params": false,
    "log_requests": false,
    "log_chat_completion_requests": false
  },
  "model": {
    "model_dir": "/workspace/models",
    "model_name": "gemma-4-26b-a4b-exl3",
    "backend": "exllamav3",
    "inline_model_loading": false,
    "max_seq_len": 65536,
    "cache_size": 66560,
    "cache_mode": "Q4",
    "tensor_parallel": false,
    "gpu_split_auto": true,
    "autosplit_reserve": [
      512
    ],
    "chunk_size": 2048,
    "output_chunking": true,
    "max_batch_size": 1,
    "vision": true,
    "reasoning": true,
    "start_in_reasoning": "auto",
    "tool_format": null,
    "template_vars_default": {
      "enable_thinking": true
    }
  },
  "draft_model": {
    "draft_mode": "disabled"
  },
  "memory": {
    "sysmem_recurrent_cache": 4096,
    "sysmem_kv_cache": 0,
    "cuda_malloc_async": true
  },
  "developer": {
    "disable_request_streaming": false
  }
}
